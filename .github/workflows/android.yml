name: Android CI
run-name: ${{github.workflow}} - ${{vars.TAG}} - ${{github.sha}}

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password (not needed for debug build)'
        required: false
        default: ''
      branch:
        description: 'Branch'
        required: true
        default: 'master'

permissions:
    id-token: write
    contents: read
    attestations: write

jobs:
  build:

    runs-on: ubuntu-latest

    #https://github.com/actions/checkout
    #https://github.com/actions/setup-java
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.branch }}
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Mask password
      if: inputs.password != ''
      run: |
        INP_PASSWORD=$(jq -r '.inputs.password' $GITHUB_EVENT_PATH)
        echo ::add-mask::$INP_PASSWORD
        echo PASSWORD="$INP_PASSWORD" >> $GITHUB_ENV

    # 在 CI 上现场生成一个一次性 keystore，并写出完整的 keystore.properties，
    # 让 build.gradle 第 154 行的 file(keystoreProperties['storeFile']) 拿到真实文件
    - name: Create throwaway keystore
      run: |
        keytool -genkeypair -v \
          -keystore Android.keystore \
          -alias androidci \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storetype PKCS12 \
          -storepass android -keypass android \
          -dname "CN=Android CI,O=Android CI,C=US"
        {
          echo "storeFile=$GITHUB_WORKSPACE/Android.keystore"
          echo "storePassword=android"
          echo "keyAlias=androidci"
          echo "keyPassword=android"
        } > keystore.properties
        touch local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check with Lint
      continue-on-error: true
      run: ./gradlew lintGithubDebug lintLargeDebug
    - name: Build with Gradle
      run: ./gradlew assembleGithubDebug assembleLargeDebug
    #https://docs.github.com/en/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds
    #https://github.com/actions/attest-build-provenance
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: 'app/build/outputs/apk/**/debug/*.apk'
    #https://github.com/actions/upload-artifact
    - uses: actions/upload-artifact@v6
      with:
        name: Mapping files
        path: app/build/outputs/mapping/**/mapping.txt
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v6
      with:
        name: Native debug symbols
        path: app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v6
      with:
        name: APK files
        path: app/build/outputs/apk/**/debug/*.apk
