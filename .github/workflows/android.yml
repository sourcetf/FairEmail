name: Android CI
run-name: ${{github.workflow}} - ${{vars.TAG}} - ${{github.sha}}

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password (not needed for this build)'
        required: false
        default: ''
      branch:
        description: 'Branch'
        required: true
        default: 'master'

permissions:
    id-token: write
    contents: write
    attestations: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.branch }}
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Mask password
      if: inputs.password != ''
      run: |
        INP_PASSWORD=$(jq -r '.inputs.password' $GITHUB_EVENT_PATH)
        echo ::add-mask::$INP_PASSWORD
        echo PASSWORD="$INP_PASSWORD" >> $GITHUB_ENV

    - name: Restore keystore
      id: ks
      uses: actions/cache@v4
      with:
        path: Android.keystore
        key: androidci-keystore

    - name: Create keystore if missing
      if: steps.ks.outputs.cache-hit != 'true'
      run: |
        keytool -genkeypair -v \
          -keystore Android.keystore \
          -alias androidci \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storetype PKCS12 \
          -storepass android -keypass android \
          -dname "CN=Android CI,O=Android CI,C=US"

    - name: Write keystore.properties
      run: |
        {
          echo "storeFile=$GITHUB_WORKSPACE/Android.keystore"
          echo "storePassword=android"
          echo "keyAlias=androidci"
          echo "keyPassword=android"
        } > keystore.properties
        touch local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check with Lint
      continue-on-error: true
      run: ./gradlew --no-configuration-cache lintGithubRelease

    - name: Build with Gradle
      run: ./gradlew --no-configuration-cache assembleGithubRelease assembleLargeRelease

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: 'app/build/outputs/apk/**/release/*.apk'

    - name: Get version from APK filename
      id: ver
      run: |
        APK="$(ls app/build/outputs/apk/*/release/*.apk | head -n 1)"
        VER="$(basename "$APK" | cut -d- -f2)"
        echo "tag=$VER" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ steps.ver.outputs.tag }}"
        APKS=(app/build/outputs/apk/*/release/*.apk)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" --clobber "${APKS[@]}"
        else
          gh release create "$TAG" \
            --title "FairEmail $TAG" \
            --generate-notes \
            "${APKS[@]}"
        fi

    - uses: actions/upload-artifact@v6
      with:
        name: Mapping files
        path: app/build/outputs/mapping/**/mapping.txt
        if-no-files-found: ignore

    - uses: actions/upload-artifact@v6
      with:
        name: Native debug symbols
        path: app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
        if-no-files-found: ignore

    - uses: actions/upload-artifact@v6
      with:
        name: APK files
        path: app/build/outputs/apk/**/release/*.apk
